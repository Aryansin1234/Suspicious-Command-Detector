# ──────────────────────────────────────────────────────────────────
# SCD Rules Configuration
# Format: ID|RISK|PATTERN|DESCRIPTION
# Lines starting with '#' are comments. Blank lines are ignored.
# ──────────────────────────────────────────────────────────────────

# R-01: Privilege escalation
R-01|HIGH|sudo su|Privilege escalation - sudo to root shell
R-01|HIGH|sudo -i|Privilege escalation - interactive root shell
R-01|HIGH|sudo bash|Privilege escalation - sudo to bash shell

# R-02: Recursive file deletion (CRITICAL)
R-02|CRITICAL|rm -rf /|Recursive deletion of root filesystem
R-02|CRITICAL|rm -rf /*|Recursive deletion of root contents
R-02|CRITICAL|rm -rf ~|Recursive deletion of home directory

# R-03: Broad permission grants on system directories
R-03|HIGH|chmod 777 /etc|Broad permission grant on /etc
R-03|HIGH|chmod 777 /bin|Broad permission grant on /bin
R-03|HIGH|chmod 777 /usr|Broad permission grant on /usr

# R-04: Remote code execution via pipe
R-04|HIGH|curl|Remote code execution via curl
R-04|HIGH|wget|Remote code execution via wget

# R-05: Reverse shell indicators (CRITICAL)
R-05|CRITICAL|nc -e|Reverse shell using netcat
R-05|CRITICAL|/dev/tcp|Reverse shell using /dev/tcp
R-05|CRITICAL|bash -i >& /dev|Interactive bash reverse shell

# R-06: Persistence mechanisms
R-06|MEDIUM|/etc/cron|Write to cron - persistence mechanism
R-06|MEDIUM|.bashrc|Modification of .bashrc - persistence
R-06|MEDIUM|.profile|Modification of .profile - persistence

# R-07: Obfuscated command execution
R-07|MEDIUM|base64 -d|Obfuscated command via base64 decode

# R-08: History evasion
R-08|LOW|unset HISTFILE|History file evasion
R-08|LOW|history -c|History clearing
R-08|LOW|HISTFILESIZE=0|History size evasion

# R-09: Privileged file manipulation
R-09|HIGH|chown root|Privileged file ownership change
R-09|HIGH|chattr +i|Immutable file attribute set
R-09|HIGH|visudo|Direct sudoers file editing

# R-10: Aggressive process termination
R-10|MEDIUM|kill -9|Aggressive process termination
R-10|MEDIUM|pkill -f|Pattern-based process killing

# ──────────────────────────────────────────────────────────────────
# REGEX RULES (use "regex:" prefix for POSIX extended regex)
# ──────────────────────────────────────────────────────────────────

# R-11: Encoded payload patterns (regex)
R-11|HIGH|regex:(^|[[:space:]])python[23]?[[:space:]]+-c[[:space:]]|Python one-liner execution
R-11|HIGH|regex:(^|[[:space:]])perl[[:space:]]+-e[[:space:]]|Perl one-liner execution

# R-12: Data exfiltration patterns (regex)
R-12|HIGH|regex:(^|[[:space:]])curl[[:space:]].*-d[[:space:]]|Data exfiltration via curl POST
R-12|HIGH|regex:(^|[[:space:]])scp[[:space:]].*@.*:|File transfer via scp

# R-13: SSH-based attacks (regex)
R-13|MEDIUM|regex:(^|[[:space:]])ssh[[:space:]].*-R[[:space:]]|SSH reverse tunnel
R-13|MEDIUM|regex:(^|[[:space:]])ssh[[:space:]].*-L[[:space:]]|SSH local port forward
