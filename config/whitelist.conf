# ──────────────────────────────────────────────────────────────────
# SCD Whitelist — Known-safe patterns
# One pattern per line. If a command matches any whitelist entry,
# it is silently skipped even if it matches a detection rule.
# Lines starting with '#' are comments. Blank lines are ignored.
# ──────────────────────────────────────────────────────────────────

# Safe package management
sudo apt update
sudo apt upgrade
sudo yum update
sudo dnf update

# Safe build cleanup
rm -rf ./build
rm -rf ./node_modules
rm -rf ./dist
rm -rf ./__pycache__

# Safe curl usage (no pipe)
curl --version
curl -I
wget --version

# Safe history commands
history
history | grep
